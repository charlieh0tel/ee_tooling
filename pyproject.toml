[project]
name = "ee-tooling"
version = "0.1.0"
description = "Tools, agent skills and house style for KiCad boards made at JLCPCB"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [
    { name = "Christopher Hoover", email = "ch@murgatroid.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pillow>=13.0.0",
]

[project.scripts]
jlcpcb-release = "ee_tooling.jlcpcb_release:main"
ee-tooling-adopt = "ee_tooling.adopt:main"
placement-score = "ee_tooling.placement_kicad:main"
kicad-style-check = "ee_tooling.kicad_style_check:main"

[build-system]
requires = ["uv_build>=0.13.2,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ANN", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

# KiCad's pcbnew is in the system Python only, untyped.
[[tool.mypy.overrides]]
module = "pcbnew"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest>=9.2.0",
    "ruff==0.17.0",
]

[tool.ruff.lint.per-file-ignores]
# Standalone PEP 723 scripts with their own dependencies: not type-checked.
"tools/**" = ["ANN"]
