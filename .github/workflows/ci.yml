name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ci:
    uses: charlieh0tel/deb-workflows/.github/workflows/python-ci.yml@0abfb3e29c9024240b31e7dd6d63a381c39d62c4 # v1
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv run mypy
  kicad:
    # The tests the other jobs skip for want of kicad-cli (KiCad 10) and
    # poppler; failing if any of them is skipped here.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad poppler-utils
          kicad-cli version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: |
          set -o pipefail
          uv run pytest -rs | tee pytest.log
          ! grep -E "^SKIPPED.*(kicad-cli|poppler)" pytest.log
  attribution:
    # No commit credits an AI assistant (AGENTS.md): the commit-msg
    # hook's checks of the messages, authors and committers over the
    # whole history, for a commit made in a clone without the hook; and
    # the hook's own tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: git log --format=%B HEAD | sh .githooks/commit-msg --messages /dev/stdin
      - run: >-
          git log --format='%an <%ae>%n%cn <%ce>' HEAD
          | sh .githooks/commit-msg --identities /dev/stdin
      - run: make hook-test
