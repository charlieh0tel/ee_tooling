name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ci:
    uses: charlieh0tel/deb-workflows/.github/workflows/python-ci.yml@0abfb3e29c9024240b31e7dd6d63a381c39d62c4 # v1
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv run mypy
  attribution:
    # No commit credits an AI assistant (AGENTS.md): the commit-msg
    # hook's checks of the messages, authors and committers over the
    # whole history, for a commit made in a clone without the hook; and
    # the hook's own tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: git log --format=%B HEAD | sh .githooks/commit-msg --messages /dev/stdin
      - run: >-
          git log --format='%an <%ae>%n%cn <%ce>' HEAD
          | sh .githooks/commit-msg --identities /dev/stdin
      - run: make hook-test
